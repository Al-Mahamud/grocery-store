spring:
  application:
    name: haat-store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haat}
    username: ${DB_USERNAME:haat}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  session:
    timeout: 14d
    jdbc:
      initialize-schema: never

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: 14d

management:
  endpoints:
    web:
      exposure:
        include: health

store:
  storage-root: ${STORAGE_ROOT:storage}
  media-url: /media
  # Where shoppers' browsers open the shop; payment pages send them back here.
  web-url: ${WEB_URL:http://localhost:3000}
  delivery:
    fee: 49
    free-over: 1500
    minimum-order: 300
  slots:
    # Two-hour delivery windows, offered for today and the next two days (Dhaka time).
    zone: Asia/Dhaka
    starts: [8, 10, 12, 14, 16, 18, 20]
    length-hours: 2
    days-ahead: 3
    capacity: 25
    # A slot stops taking orders this long before it starts.
    cutoff: 2h
  payment:
    # An unpaid online order holds its stock and slot this long, then is cancelled.
    expiry: 30m
    max-attempts: 5
    sslcommerz:
      # Credentials from the environment; online payment stays off until both are set.
      store-id: ${SSLCOMMERZ_STORE_ID:}
      store-password: ${SSLCOMMERZ_STORE_PASSWORD:}
      base-url: ${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
      # The address SSLCommerz posts to (return pages and IPN): the public shop address.
      callback-url: ${store.web-url}
    jobs:
      enabled: true
  admin:
    # Packs at or below this stock show as running low.
    low-stock: 10
    # The first staff account, created at start-up when there is none yet (then remove these).
    first-staff-name: ${ADMIN_NAME:Owner}
    first-staff-phone: ${ADMIN_PHONE:}
    first-staff-password: ${ADMIN_PASSWORD:}
  sms:
    # log: write texts to the log only (local runs). sslwireless: send through SSL Wireless.
    driver: ${SMS_DRIVER:log}
    jobs:
      enabled: true
    sslwireless:
      base-url: ${SSLWIRELESS_BASE_URL:https://smsplus.sslwireless.com}
      api-token: ${SSLWIRELESS_API_TOKEN:}
      sid: ${SSLWIRELESS_SID:}
  codes:
    # One-time codes sent by text: how long they last, tries per code, and resend limits.
    valid-for: 10m
    max-attempts: 5
    resend-after: 60s
    per-phone-per-hour: 5
